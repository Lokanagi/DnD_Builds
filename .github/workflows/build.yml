name: Build desktop app

# Builds the Tauri shell for Windows and macOS (universal binary, covers both
# Intel and Apple Silicon Macs) on every push to main and on demand. Needs
# two repository secrets set in GitHub (Settings -> Secrets and variables ->
# Actions): VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY — the frontend bakes
# these in at build time, there's no runtime config file to edit after.
#
# Every successful build also republishes the "latest" GitHub Release, so
# there's one stable page (repo -> Releases) with the newest installers for
# both platforms — no digging through Actions runs/branches.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: steinhart-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: steinhart-*
          path: bundles
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Последняя сборка"
          body: "Автособрано из ${{ github.sha }}. Берите установщик под свою ОС: .msi/.exe — Windows, .dmg — macOS."
          make_latest: true
          files: |
            bundles/**/*.dmg
            bundles/**/*.msi
            bundles/**/*.exe
